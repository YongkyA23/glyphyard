[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/protocol",
    "crates/activation",
    "crates/engine",
    "crates/sync",
    "crates/adobe-bridge",
    "apps/server",
    "apps/desktop/src-tauri",
    "apps/setup",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
typeshelf-core = { path = "crates/core" }
typeshelf-protocol = { path = "crates/protocol" }
typeshelf-activation = { path = "crates/activation" }
