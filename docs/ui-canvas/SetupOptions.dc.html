<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typeshelf Setup · Options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #2547D0;outline-offset:2px}
@media (prefers-reduced-motion: no-preference){
  .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .rise.d2{animation-delay:.06s}.rise.d3{animation-delay:.12s}.rise.d4{animation-delay:.18s}
}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{transition:transform .15s ease, background-color .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.knob{transition:left .22s cubic-bezier(.3,1.4,.5,1)}
.track{transition:background-color .2s ease}
</style>
</helmet>
<div style="width: 760px; height: 480px; display: flex; overflow: hidden; border-radius: 12px; background: #FFFFFF; color: #1C1917; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.08);">
  <aside aria-label="Typeshelf" style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 28px; background: #141210; color: #F5F5F4;">
    <span style="font-weight: 600; font-size: 14px;">Typeshelf</span>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
      <span aria-hidden="true" style="font-family: 'Instrument Serif', serif; font-size: 150px; line-height: 1; height: 170px; display: flex; align-items: flex-end;">Aa</span>
      <div aria-hidden="true" style="width: 100%; height: 2px; border-radius: 1px; background: linear-gradient(90deg, transparent, #57534E 15%, #57534E 85%, transparent);"></div>
      <span aria-hidden="true" style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #A8A29E; height: 16px;">Instrument Serif</span>
    </div>
    <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; line-height: 1.25; color: #D6D3D1;">Every font,<br>on the right shelf.</span>
  </aside>
  <main style="flex: 1; position: relative; display: flex; flex-direction: column; padding: 36px 40px 28px;">
    <button type="button" aria-label="Close setup" class="btn" style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #57534E; cursor: pointer; font-size: 18px;">×</button>
    <a href="SetupWelcome.dc.html" class="rise" style="align-self: flex-start; font-size: 13px; color: #57534E; text-decoration: none;">← Back</a>
    <h1 class="rise d2" style="margin: 10px 0 0; font-size: 26px; font-weight: 600; letter-spacing: -.4px;">Install options</h1>
    <div class="rise d3" style="margin-top: 20px; display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 13px; font-weight: 500;">Install location</span>
      <div style="display: flex; gap: 8px;">
        <input type="text" readonly="{{yes}}" value="C:\Users\budi\AppData\Local\Programs\Typeshelf" aria-label="Install location" style="flex: 1; min-width: 0; height: 40px; padding: 0 12px; border: 1px solid #D6D3D1; border-radius: 8px; background: #FAFAF9; font-family: 'Geist Mono', monospace; font-size: 12px; color: #44403C;">
        <button type="button" class="btn" style="height: 40px; padding: 0 14px; border: 1px solid #D6D3D1; border-radius: 8px; background: #FFFFFF; cursor: pointer;">Change…</button>
      </div>
    </div>
    <div class="rise d4" style="margin-top: 18px; display: flex; flex-direction: column;">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; border-bottom: 1px solid #F0EFEE;">
          <span style="display: flex; flex-direction: column; gap: 2px;"><span>{{o.label}}</span><span style="font-size: 12px; color: #6F6A65;">{{o.hint}}</span></span>
          <button type="button" aria-pressed="{{o.pressed}}" aria-label="{{o.label}}" onClick="{{o.toggle}}" class="track" style="width: 40px; height: 22px; border: 0; border-radius: 11px; padding: 0; position: relative; cursor: pointer; flex-shrink: 0; background: {{o.track}};">
            <span class="knob" style="position: absolute; top: 3px; left: {{o.knob}}; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF;"></span>
          </button>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px;">
      <a href="SetupWelcome.dc.html" class="btn" style="height: 44px; display: flex; align-items: center; padding: 0 18px; border: 1px solid #D6D3D1; border-radius: 10px; color: #1C1917; text-decoration: none;">Back</a>
      <a href="SetupProgress.dc.html" class="btn" style="height: 44px; display: flex; align-items: center; padding: 0 26px; border-radius: 10px; background: #2547D0; color: #FFFFFF; text-decoration: none; font-weight: 500;">Install</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menu: true, desktop: false, login: true };
  }
  renderVals() {
    const s = this.state;
    const opts = [
      ['menu', 'Start menu shortcut', 'Find Typeshelf by searching Start'],
      ['desktop', 'Desktop shortcut', 'An icon on your desktop'],
      ['login', 'Start Typeshelf when I sign in', 'Your fonts are ready right away; it waits in the tray']
    ].map(([k, label, hint]) => ({
      label, hint, pressed: s[k] ? 'true' : 'false',
      track: s[k] ? '#2547D0' : '#D6D3D1', knob: s[k] ? '21px' : '3px',
      toggle: () => this.setState({ [k]: !s[k] })
    }));
    return { opts, yes: true };
  }
}
</script>
</body>
</html>
