<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typeshelf Admin · Users</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#2547D0}a:hover{color:#1A36A8}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #2547D0;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; background: #F7F7F6; color: #1C1917; font-family: 'Geist', system-ui, sans-serif; font-size: 14px;">
  <div style="flex: 1 1 240px; display: flex;">
    <dc-import name="AdminSidebar" active="users" hint-size="100%,860px"></dc-import>
  </div>
  <main style="flex: 999 1 640px; min-width: 0; padding: 28px 36px; display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
      <h1 style="margin: 0; font-size: 26px; font-weight: 600;">Users</h1>
      <sc-if value="{{canMerge}}" hint-placeholder-val="{{false}}">
        <a href="AdminMerge.dc.html" style="height: 40px; display: flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #2547D0; color: #FFFFFF; text-decoration: none; font-weight: 500;">Merge 2 selected installs</a>
      </sc-if>
      <sc-if value="{{cantMerge}}" hint-placeholder-val="{{true}}">
        <span style="font-size: 13px; color: #6F6A65;">Select 2 installs to merge them into one person</span>
      </sc-if>
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center;">
      <label for="usearch" style="position: absolute; left: -9999px;">Search by name or install ID</label>
      <input id="usearch" type="search" value="{{q}}" onChange="{{setQ}}" placeholder="Search by name, old name or install ID" style="flex: 1 1 320px; height: 40px; padding: 0 12px; border: 1px solid #D6D3D1; border-radius: 8px; background: #FFFFFF;">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
        <button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="height: 34px; padding: 0 12px; border-radius: 17px; cursor: pointer; {{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="overflow-x: auto; border: 1px solid #E7E5E4; border-radius: 12px; background: #FFFFFF;">
      <table style="width: 100%; min-width: 960px; border-collapse: collapse; font-size: 13px;">
        <caption style="position: absolute; left: -9999px;">Installs</caption>
        <thead><tr style="text-align: left; color: #57534E; background: #FAFAF9;">
          <th style="padding: 10px 14px; width: 44px;"><span style="position: absolute; left: -9999px;">Select</span></th>
          <th style="padding: 10px 14px; font-weight: 500;">Name</th>
          <th style="padding: 10px 14px; font-weight: 500;">Install ID</th>
          <th style="padding: 10px 14px; font-weight: 500;">Computer</th>
          <th style="padding: 10px 14px; font-weight: 500;">Active fonts</th>
          <th style="padding: 10px 14px; font-weight: 500;">Last seen</th>
          <th style="padding: 10px 14px; font-weight: 500;">Next name change</th>
        </tr></thead>
        <tbody>
          <sc-for list="{{rows}}" as="u" hint-placeholder-count="7">
            <tr style="border-top: 1px solid #F0EFEE;">
              <td style="padding: 12px 14px;"><input type="checkbox" checked="{{u.checked}}" onChange="{{u.toggle}}" aria-label="{{u.aria}}" style="width: 16px; height: 16px; accent-color: #2547D0;"></td>
              <td style="padding: 12px 14px;">
                <span style="display: flex; flex-direction: column; gap: 2px;">
                  <span style="display: flex; gap: 8px; align-items: center;"><a href="AdminUserDetail.dc.html" style="color: #1C1917; font-weight: 500; text-decoration: none;">{{u.name}}</a>
                    <sc-if value="{{u.flag}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; padding: 1px 8px; border-radius: 10px; {{u.flagStyle}}">{{u.flagLabel}}</span></sc-if>
                  </span>
                  <span style="font-size: 12px; color: #6F6A65;">{{u.prev}}</span>
                </span>
              </td>
              <td style="padding: 12px 14px; font-family: 'Geist Mono', monospace; font-size: 12px;">{{u.id}}</td>
              <td style="padding: 12px 14px;">{{u.os}}</td>
              <td style="padding: 12px 14px;">{{u.fonts}}</td>
              <td style="padding: 12px 14px;"><span style="display: flex; align-items: center; gap: 6px;"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{u.dot}};"></span>{{u.seen}}</span></td>
              <td style="padding: 12px 14px; color: #44403C;">{{u.next}}</td>
            </tr>
          </sc-for>
        </tbody>
      </table>
    </div>
    <span style="font-size: 12px; color: #6F6A65;">Showing {{count}} of 48 installs</span>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: '', chip: 'all', sel: { a: true, f: true } };
  }
  renderVals() {
    const s = this.state;
    const users = [
      { k: 'a', name: 'Budi Santoso', prev: 'Previously: Budi S.', id: '7F3A-2C9E-91C2', os: 'Windows 11', fonts: 86, seen: 'Online', online: true, next: '11 Nov 2026', overrides: true },
      { k: 'b', name: 'Sari Wulandari', prev: 'Previously: Sari W.', id: '1B77-40DA-0E15', os: 'Windows 11', fonts: 54, seen: 'Online', online: true, next: '26 Nov 2026' },
      { k: 'c', name: 'Rizky Pratama', prev: 'No name changes', id: 'C902-7E11-5A3B', os: 'Windows 10', fonts: 112, seen: 'Online', online: true, next: 'Any time', failures: true },
      { k: 'd', name: 'Dewi Lestari', prev: 'Previously: Dewi, Dewi L.', id: '5D0C-91F2-AA70', os: 'macOS · Apple Silicon', fonts: 38, seen: '2 h ago', online: false, next: '19 Nov 2026' },
      { k: 'e', name: 'Andi Wijaya', prev: 'No name changes', id: '22E8-B6C4-1F09', os: 'macOS · Apple Silicon', fonts: 9, seen: 'Online', online: true, next: 'Any time', isNew: true },
      { k: 'f', name: 'Budi S.', prev: 'No name changes', id: 'E41D-03B7-7C6A', os: 'macOS · Intel', fonts: 0, seen: '3 days ago', online: false, next: 'Any time', dupe: true },
      { k: 'g', name: 'Putri Ananda', prev: 'No name changes', id: '9AF0-6D25-3E8B', os: 'Windows 11', fonts: 61, seen: '16 days ago', online: false, next: 'Any time', stale: true }
    ];
    const q = s.q.trim().toLowerCase();
    const keep = (u) => (!q || (u.name + ' ' + u.prev + ' ' + u.id).toLowerCase().includes(q)) &&
      (s.chip === 'all' || (s.chip === 'online' && u.online) || (s.chip === 'stale' && u.stale) || (s.chip === 'overrides' && u.overrides) || (s.chip === 'dupe' && u.dupe));
    const rows = users.filter(keep).map((u) => {
      const flag = u.dupe ? ['Possible duplicate', 'background:#FEF3C7;color:#92400E'] : u.isNew ? ['New', 'background:#E7F6EC;color:#166534'] :
        u.overrides ? ['Override', 'background:#EEF2FE;color:#1E3BB0'] : u.failures ? ['Failures', 'background:#FDECEA;color:#B42318'] : null;
      return {
        ...u, checked: !!s.sel[u.k], aria: 'Select ' + u.name,
        flag: !!flag, flagLabel: flag ? flag[0] : '', flagStyle: flag ? flag[1] : '',
        dot: u.online ? '#16A34A' : '#A8A29E',
        toggle: () => this.setState({ sel: { ...s.sel, [u.k]: !s.sel[u.k] } })
      };
    });
    const chips = [['all', 'All'], ['online', 'Online'], ['overrides', 'Has overrides'], ['dupe', 'Possible duplicates'], ['stale', 'Offline 14+ days']].map(([k, label]) => ({
      label, pressed: s.chip === k ? 'true' : 'false',
      style: s.chip === k ? 'background:#1C1917;color:#FFFFFF;border:1px solid #1C1917' : 'background:#FFFFFF;color:#1C1917;border:1px solid #D6D3D1',
      pick: () => this.setState({ chip: k })
    }));
    const selected = Object.values(s.sel).filter(Boolean).length;
    return {
      rows, chips, q: s.q, count: rows.length,
      canMerge: selected === 2, cantMerge: selected !== 2,
      setQ: (e) => this.setState({ q: e.target.value })
    };
  }
}
</script>
</body>
</html>
