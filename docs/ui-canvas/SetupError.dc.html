<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #2547D0;outline-offset:2px}
@media (prefers-reduced-motion: no-preference){
  .wobble{animation:wobble 2.8s ease-in-out infinite;transform-origin:50% 100%}
  .shake{animation:shake .45s ease both}
  .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .rise.d2{animation-delay:.08s}.rise.d3{animation-delay:.16s}
}
@keyframes wobble{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(-6deg)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
</style>
</helmet>
<div style="width: 760px; height: 480px; display: flex; overflow: hidden; border-radius: 12px; background: #FFFFFF; color: #1C1917; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.08);">

        <span class="wobble" style="display: inline-block; font-family: 'Fraunces', serif; font-weight: 600; font-size: 80px; line-height: .9; color: #FDE68A; transform: rotate(-14deg);">g</span>
        <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 76px; line-height: .9;">R</span>
        <span style="font-family: 'Bebas Neue', sans-serif; font-size: 88px; line-height: .9;">3</span>
      </div>
      <div style="height: 2px; border-radius: 1px; background: linear-gradient(90deg, transparent, #57534E 10%, #57534E 90%, transparent);"></div>
      <span style="text-align: center; font-family: 'Geist Mono', monospace; font-size: 11px; color: #A8A29E;">One thing is still in use.</span>
    </div>
    <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; line-height: 1.25; color: #D6D3D1;">Every font,<br>on the right shelf.</span>
  </aside>
  <main style="flex: 1; position: relative; display: flex; flex-direction: column; padding: 40px 40px 28px;">
    <button type="button" aria-label="Close setup" class="btn" style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #57534E; cursor: pointer; font-size: 18px;">×</button>
    <span class="shake" style="width: 56px; height: 56px; border-radius: 28px; background: #FEF3C7; display: flex; align-items: center; justify-content: center;">
      <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#92400E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg>
    </span>
    <h1 class="rise" style="margin: 22px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -.5px;">Typeshelf is still open</h1>
    <p class="rise d2" style="margin: 10px 0 0; color: #57534E; line-height: 1.55; max-width: 380px;">Setup needs to replace files Typeshelf is using. Your fonts stay turned on while it restarts. Nothing in your library changes.</p>
    <div class="rise d3" style="margin-top: 18px; padding: 12px 14px; border-radius: 10px; background: #FAFAF9; border: 1px solid #E7E5E4; font-size: 13px; color: #44403C; display: flex; gap: 10px; align-items: center;">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A; flex-shrink: 0;"></span>
      <span>typeshelf.exe · running in the tray</span>
    </div>
    <div style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; gap: 8px;">
      <button type="button" class="btn" style="height: 44px; padding: 0 4px; border: 0; background: transparent; color: #57534E; cursor: pointer;">Cancel</button>
      <span style="display: flex; gap: 8px;">
        <a href="SetupProgress.dc.html" class="btn" style="height: 44px; display: flex; align-items: center; padding: 0 16px; border: 1px solid #D6D3D1; border-radius: 10px; color: #1C1917; text-decoration: none;">Try again</a>

    </div>
  </main>
</div>
