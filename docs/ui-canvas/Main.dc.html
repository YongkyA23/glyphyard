<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typeshelf · Welcome</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Instrument+Serif:ital@0;1&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
a{color:#2547D0}a:hover{color:#1A36A8}
input:focus-visible,a:focus-visible,button:focus-visible{outline:2px solid #2547D0;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 800px; display: flex; flex-direction: column; background: #FFFFFF; color: #1C1917; font-family: 'Geist', system-ui, sans-serif; font-size: 14px;">
  <div style="height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #E7E5E4; background: #FAFAF9;">
    <span style="font-weight: 500; font-size: 13px;">Typeshelf</span>
    <span aria-hidden="true" style="display: flex; gap: 18px; color: #6F6A65; font-size: 13px;">
      <span>—</span><span>☐</span><span>✕</span>
    </span>
  </div>
  <div style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px;">
    <div style="width: 100%; max-width: 460px; display: flex; flex-direction: column; gap: 28px;">
      <div style="font-family: 'Instrument Serif', serif; font-size: 96px; line-height: 1; letter-spacing: -2px;">Aa<span style="font-style: italic; color: #2547D0;">g</span></div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <h1 style="margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.4px;">Welcome. What should we call you?</h1>
        <p style="margin: 0; color: #57534E; line-height: 1.55;">Your name is shown to your admin next to the fonts you use. That’s the only thing we need to get started.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <label for="name" style="font-weight: 500;">Your name</label>
        <input id="name" type="text" value="{{name}}" onChange="{{setName}}" placeholder="e.g. Budi Santoso" autocomplete="name" style="height: 48px; padding: 0 14px; border: 1px solid #D6D3D1; border-radius: 10px; font-size: 16px; background: #FFFFFF;">
        <sc-if value="{{showError}}" hint-placeholder-val="{{false}}">
          <span style="color: #B42318; font-size: 13px;">Enter your name to continue.</span>
        </sc-if>
        <span style="color: #6F6A65; font-size: 13px; line-height: 1.5;">You can change it later in Settings, once every 30 days.</span>
      </div>
      <sc-if value="{{hasName}}" hint-placeholder-val="{{true}}">
        <a href="Library.dc.html" style="height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #2547D0; color: #FFFFFF; text-decoration: none; font-weight: 500; font-size: 15px;">Continue</a>
      </sc-if>
      <sc-if value="{{noName}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{tryContinue}}" style="height: 48px; border: 0; border-radius: 10px; background: #2547D0; color: #FFFFFF; font-weight: 500; font-size: 15px; cursor: pointer;">Continue</button>
      </sc-if>
      <div style="display: flex; align-items: center; gap: 8px; color: #6F6A65; font-size: 12px;">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: #16A34A;"></span>
        <span>Connected to [your server address]</span>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: 'Budi Santoso', tried: false };
  }
  renderVals() {
    const name = this.state.name;
    const hasName = name.trim().length > 0;
    return {
      name,
      hasName,
      noName: !hasName,
      showError: !hasName && this.state.tried,
      setName: (e) => this.setState({ name: e.target.value, tried: false }),
      tryContinue: () => this.setState({ tried: true })
    };
  }
}
</script>
</body>
</html>
