<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Main" style="width: 100%; min-height: 760px; height: 100%; display: flex; flex-direction: column; gap: 20px; padding: 16px 12px; background: #FAFAF9; border-right: 1px solid #E7E5E4; color: #1C1917; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; box-sizing: border-box;">
  <div style="display: flex; flex-direction: column; gap: 2px;">
    <sc-for list="{{nav}}" as="item" hint-placeholder-count="7">
      <a href="{{item.href}}" aria-current="{{item.current}}" style="display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 10px; border-radius: 8px; text-decoration: none; {{item.style}}">
        <span>{{item.label}}</span>
        <span style="font-size: 12px; color: #6F6A65;">{{item.count}}</span>
      </a>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span style="padding: 0 10px; font-size: 12px; font-weight: 500; color: #6F6A65;">Folders</span>
    <sc-for list="{{folders}}" as="f" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; font-size: 13px;">
        <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 4px; background: {{f.dot}};"></span>
        <span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{f.name}}</span>
        <span style="font-size: 12px; color: {{f.noteColor}};">{{f.note}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span style="padding: 0 10px; font-size: 12px; font-weight: 500; color: #6F6A65;">Collections</span>
    <sc-for list="{{collections}}" as="c" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; height: 30px; align-items: center; padding: 0 10px; font-size: 13px;">
        <span>{{c.name}}</span><span style="font-size: 12px; color: #6F6A65;">{{c.count}}</span>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <span style="padding: 0 10px; font-size: 12px; font-weight: 500; color: #6F6A65;">Licenses</span>
    <sc-for list="{{licenses}}" as="l" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; font-size: 13px;">
        <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{l.color}};"></span>
        <span style="flex: 1;">{{l.name}}</span><span style="font-size: 12px; color: #6F6A65;">{{l.count}}</span>
      </div>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 10px; border: 1px solid #E7E5E4; border-radius: 10px; background: #FFFFFF;">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 16px; background: #E8EDFD; color: #1E3BB0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px;">BS</span>
    <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
      <span style="font-weight: 500; font-size: 13px;">Budi Santoso</span>
      <span style="font-size: 12px; color: #166534;">Synced · 1 min ago</span>
    </span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["library","playground","sets","google","organize","pdf","settings"],"default":"library"},"$preview":{"width":240,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'library';
    const nav = [
      { key: 'library', label: 'Library', href: 'Library.dc.html', count: '1,284' },
      { key: 'playground', label: 'Playground', href: 'Playground.dc.html', count: '' },
      { key: 'sets', label: 'Project sets', href: 'ProjectSets.dc.html', count: '3' },
      { key: 'google', label: 'Google Fonts', href: 'GoogleFonts.dc.html', count: '' },
      { key: 'organize', label: 'Auto-organize', href: 'AutoOrganize.dc.html', count: '93' },
      { key: 'pdf', label: 'Fonts in a PDF', href: 'PdfFonts.dc.html', count: '' },
      { key: 'settings', label: 'Settings', href: 'Settings.dc.html', count: '' }
    ].map((i) => ({
      ...i,
      current: i.key === active ? 'page' : 'false',
      style: i.key === active ? 'background:#E8EDFD;color:#1E3BB0;font-weight:500' : 'color:#1C1917'
    }));
    return {
      nav,
      folders: [
        { name: 'D:\\Fonts\\Licensed', note: '812', dot: '#16A34A', noteColor: '#6F6A65' },
        { name: 'D:\\Fonts\\Client work', note: '340', dot: '#16A34A', noteColor: '#6F6A65' },
        { name: 'E:\\Archive', note: 'Offline', dot: '#D97706', noteColor: '#92400E' }
      ],
      collections: [
        { name: 'Favorites', count: '24' },
        { name: 'Recently used', count: '18' },
        { name: 'Headlines', count: '11' }
      ],
      licenses: [
        { name: 'Licensed', count: '702', color: '#16A34A' },
        { name: 'Personal use', count: '214', color: '#2547D0' },
        { name: 'Client-provided', count: '96', color: '#7C3AED' },
        { name: 'Unknown', count: '272', color: '#D97706' }
      ]
    };
  }
}
</script>
</body>
</html>
