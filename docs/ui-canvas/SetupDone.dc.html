<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Typeshelf Setup · Ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400&amp;family=Instrument+Serif:ital@0;1&amp;family=Fraunces:opsz,wght@9..144,600&amp;family=Space+Grotesk:wght@600&amp;family=Syne:wght@700&amp;family=Bebas+Neue&amp;family=DM+Serif+Display&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid #2547D0;outline-offset:2px}
.check path{stroke-dasharray:30;stroke-dashoffset:0}
@media (prefers-reduced-motion: no-preference){
  .ring{animation:ring .45s cubic-bezier(.3,1.5,.5,1) both}
  .check path{animation:draw .45s .25s ease-out both}
  .rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
  .rise.d2{animation-delay:.3s}.rise.d3{animation-delay:.38s}.rise.d4{animation-delay:.46s}
  .bob{animation:bob 2.4s ease-in-out infinite}
  .bob:nth-child(2){animation-delay:.15s}.bob:nth-child(3){animation-delay:.3s}.bob:nth-child(4){animation-delay:.45s}.bob:nth-child(5){animation-delay:.6s}.bob:nth-child(6){animation-delay:.75s}
}
@keyframes ring{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-4px)}}
.btn{transition:transform .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.knob{transition:left .22s cubic-bezier(.3,1.4,.5,1)}
.track{transition:background-color .2s ease}
</style>
</helmet>
<div style="width: 760px; height: 480px; display: flex; overflow: hidden; border-radius: 12px; background: #FFFFFF; color: #1C1917; font-family: 'Geist', system-ui, sans-serif; font-size: 14px; box-shadow: 0 0 0 1px rgba(0,0,0,.08);">
  <aside aria-label="Typeshelf" style="width: 300px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 28px; background: #141210; color: #F5F5F4;">
    <span style="font-weight: 600; font-size: 14px;">Typeshelf</span>
    <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="height: 96px; display: flex; align-items: flex-end; justify-content: center; gap: 6px;">
        <span class="bob" style="font-family: 'Instrument Serif', serif; font-size: 92px; line-height: .9;">A</span>
        <span class="bob" style="font-family: 'Fraunces', serif; font-weight: 600; font-size: 80px; line-height: .9; color: #C7D2FE;">g</span>
        <span class="bob" style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 76px; line-height: .9;">R</span>
        <span class="bob" style="font-family: 'DM Serif Display', serif; font-size: 80px; line-height: .9; color: #FDE68A;">&amp;</span>
        <span class="bob" style="font-family: 'Bebas Neue', sans-serif; font-size: 88px; line-height: .9;">3</span>
        <span class="bob" style="font-family: 'Syne', sans-serif; font-weight: 700; font-size: 78px; line-height: .9; color: #A7F3D0;">f</span>
      </div>
      <div style="height: 2px; border-radius: 1px; background: linear-gradient(90deg, transparent, #57534E 10%, #57534E 90%, transparent);"></div>
      <span style="text-align: center; font-family: 'Geist Mono', monospace; font-size: 11px; color: #A8A29E;">All on the shelf.</span>
    </div>
    <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; line-height: 1.25; color: #D6D3D1;">Every font,<br>on the right shelf.</span>
  </aside>
  <main style="flex: 1; position: relative; display: flex; flex-direction: column; padding: 40px 40px 28px;">
    <button type="button" aria-label="Close setup" class="btn" style="position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border: 0; border-radius: 8px; background: transparent; color: #57534E; cursor: pointer; font-size: 18px;">×</button>
    <span class="ring" style="width: 56px; height: 56px; border-radius: 28px; background: #E7F6EC; display: flex; align-items: center; justify-content: center;">
      <svg class="check" aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#166534" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    </span>
    <h1 class="rise d2" style="margin: 22px 0 0; font-size: 32px; font-weight: 600; letter-spacing: -.6px;">Typeshelf is ready</h1>
    <p class="rise d3" style="margin: 10px 0 0; color: #57534E; line-height: 1.55; max-width: 360px;">When it opens, it asks what to call you. That’s the only setup. Then add a font folder and you’re done.</p>
    <div class="rise d4" style="margin-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid #E7E5E4; border-radius: 10px;">
      <span style="display: flex; flex-direction: column; gap: 2px;"><span>Start Typeshelf when I sign in</span><span style="font-size: 12px; color: #6F6A65;">You can change this later in Settings</span></span>
      <button type="button" aria-pressed="{{loginPressed}}" aria-label="Start Typeshelf when I sign in" onClick="{{toggleLogin}}" class="track" style="width: 40px; height: 22px; border: 0; border-radius: 11px; padding: 0; position: relative; cursor: pointer; flex-shrink: 0; background: {{track}};">
        <span class="knob" style="position: absolute; top: 3px; left: {{knob}}; width: 16px; height: 16px; border-radius: 8px; background: #FFFFFF;"></span>
      </button>
    </div>
    <div style="margin-top: auto; display: flex; justify-content: flex-end; gap: 8px;">
      <button type="button" class="btn" style="height: 44px; padding: 0 18px; border: 1px solid #D6D3D1; border-radius: 10px; background: #FFFFFF; cursor: pointer;">Close</button>
      <a href="Main.dc.html" class="btn" style="height: 44px; display: flex; align-items: center; padding: 0 24px; border-radius: 10px; background: #2547D0; color: #FFFFFF; text-decoration: none; font-weight: 500; box-shadow: 0 6px 18px rgba(37,71,208,.28);">Open Typeshelf</a>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { login: true };
  }
  renderVals() {
    const on = this.state.login;
    return {
      loginPressed: on ? 'true' : 'false',
      track: on ? '#2547D0' : '#D6D3D1',
      knob: on ? '21px' : '3px',
      toggleLogin: () => this.setState({ login: !on })
    };
  }
}
</script>
</body>
</html>
