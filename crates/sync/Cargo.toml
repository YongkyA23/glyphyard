[package]
name = "typeshelf-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7.20"
typeshelf-protocol = { workspace = true }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
