[package]
name = "typeshelf-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "typeshelf-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# custom-protocol: always serve the embedded ui/ (there is no dev server).
tauri = { version = "2", features = ["custom-protocol"] }
tauri-plugin-dialog = "2"
typeshelf-adobe-bridge = { path = "../../crates/adobe-bridge" }
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target."cfg(windows)".dependencies]
webview2-com = "0.39"
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
