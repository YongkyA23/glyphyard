[package]
name = "typeshelf-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "multipart"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
rand = "0.10.3"
rpassword = "7.5.4"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
typeshelf-core.workspace = true
typeshelf-protocol.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio-tungstenite = "0.30"
tower = { version = "0.5.3", features = ["util"] }
